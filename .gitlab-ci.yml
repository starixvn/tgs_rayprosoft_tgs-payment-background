include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/payment-background
  TgsSettingKey: payment-background
  HelmTemplateFolderName: payment-background
  BuildCacheKey: Tgs.PaymentBackground.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-docker-image:
  extends: .push-docker-image-template
  variables:
    project: Tgs.Payment.Background/Tgs.Payment.Background.csproj

push-k8s-template:
  extends: .push-k8s-template

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - |
      cat << EOF | deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "cronjob": {
            "schedule": "0 21 * * *"
          }
        }
      EOF

deploy-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "cronjob": {
            "schedule": "0 21 * * *"
          }
        }
      EOF

deploy-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "cronjob": {
            "schedule": "0 21 * * *"
          }
        }
      EOF
