apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "payment-background.fullname" . }}-scheduler
spec:
  schedule: '{{ .Values.cronjob.schedule }}'
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: payment-background-job
            image: alpine/curl:8.4.0
            imagePullPolicy: IfNotPresent
            command:
            - curl
            - -X
            - POST
            - http://tgs-payment-background/schedule
          restartPolicy: OnFailure
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 8 }}
          {{- end }}