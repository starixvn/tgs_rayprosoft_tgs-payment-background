apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "payment-background.fullname" . }}-scheduler
spec:
  schedule: '{{ .Values.cronjob.schedule }}'
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: payment-background-job
            image: alpine/curl:8.4.0
            imagePullPolicy: IfNotPresent
            command:
            - curl
            - -X
            - POST
            - http://tgs-payment-background/schedule
          restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "payment-background.fullname" . }}-5min-scheduler
spec:
  schedule: '1-59/5 * * * *'
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: payment-background-job
            image: alpine/curl:8.4.0
            imagePullPolicy: IfNotPresent
            command:
            - curl
            - -X
            - POST
            - http://tgs-payment-background/schedule/5min
          restartPolicy: OnFailure
