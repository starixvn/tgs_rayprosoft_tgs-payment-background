apiVersion: batch/v1
kind: CronJob
metadata:
  name: payment-background-scheduler
spec:
  schedule: "0 21 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: payment-background-job
            image: busybox:1.35
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - curl -X POST http://tgs-payment-background/schedule/agent
          restartPolicy: OnFailure