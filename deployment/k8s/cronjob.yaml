apiVersion: batch/v1
kind: CronJob
metadata:
  name: payment-background-scheduler
spec:
  schedule: "0 21 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: payment-background-job
            image: alpine/curl:3.14
            imagePullPolicy: IfNotPresent
            command:
            - curl
            - -X
            - POST
            - http://tgs-payment-background/schedule/agent
          restartPolicy: OnFailure